<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The Institutional Learning Loop"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64B3D8"/></marker></defs><rect width="1600" height="900" fill="#0E1A2B"/><rect width="1600" height="8" fill="#5BC6BD"/><text x="74" y="56" fill="#E6B96D" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">EXHIBIT 05 / THE DECISIONING INVERSION</text><text x="74" y="112" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start">The Institutional Learning Loop</text><text x="74" y="151" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Judge decisions by evidence and consequences, not by the volume of AI output.</text><line x1="72" y1="177" x2="1528" y2="177" stroke="#416078" stroke-width="2"/><line x1="316" y1="350" x2="786" y2="256" stroke="#416078" stroke-width="3"  marker-end="url(#a)"/><line x1="786" y1="256" x2="1254" y2="350" stroke="#416078" stroke-width="3"  marker-end="url(#a)"/><line x1="1254" y1="350" x2="1210" y2="638" stroke="#416078" stroke-width="3"  marker-end="url(#a)"/><line x1="1210" y1="638" x2="781" y2="724" stroke="#416078" stroke-width="3"  marker-end="url(#a)"/><line x1="781" y1="724" x2="360" y2="638" stroke="#416078" stroke-width="3"  marker-end="url(#a)"/><line x1="360" y1="638" x2="316" y2="350" stroke="#416078" stroke-width="3"  marker-end="url(#a)"/><rect x="144" y="293" width="344" height="116" rx="16" fill="#18283D" stroke="#64B3D8" stroke-width="2"/><text x="316" y="341" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">1 / SENSE</text><text x="316" y="378" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">What changed?</text><rect x="614" y="199" width="344" height="116" rx="16" fill="#18283D" stroke="#B8A7E5" stroke-width="2"/><text x="786" y="247" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">2 / EVALUATE</text><text x="786" y="284" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">What options exist?</text><rect x="1082" y="293" width="344" height="116" rx="16" fill="#18283D" stroke="#E6B96D" stroke-width="2"/><text x="1254" y="341" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">3 / AUTHORIZE</text><text x="1254" y="378" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">Who may decide?</text><rect x="1038" y="581" width="344" height="116" rx="16" fill="#18283D" stroke="#E59A82" stroke-width="2"/><text x="1210" y="629" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">4 / ACT OR DEFER</text><text x="1210" y="666" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">Proceed · challenge · wait</text><rect x="609" y="667" width="344" height="116" rx="16" fill="#18283D" stroke="#5BC6BD" stroke-width="2"/><text x="781" y="715" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">5 / LEARN</text><text x="781" y="752" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">What happened later?</text><rect x="188" y="581" width="344" height="116" rx="16" fill="#18283D" stroke="#64B3D8" stroke-width="2"/><text x="360" y="629" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">6 / CORRECT</text><text x="360" y="666" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">What must change?</text><rect x="615" y="455" width="360" height="120" rx="18" fill="#22354A" stroke="#5BC6BD" stroke-width="3"/><text x="795" y="496" fill="#5BC6BD" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">EVIDENCE RECEIPT</text><text x="795" y="530" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">Facts · inferences · permissions</text><text x="795" y="555" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle">+ outcomes observed over time</text><line x1="72" y1="855" x2="1528" y2="855" stroke="#416078"/><text x="74" y="879" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Christopher Hayes, CDAIO  |  Original conceptual framework, not an empirical measurement</text><text x="1524" y="879" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="end">THE DECISIONING TWIN / PUBLICATION EDITION</text></svg>