<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Coordination &amp; Productive Friction"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64B3D8"/></marker></defs><rect width="1600" height="900" fill="#0E1A2B"/><rect width="1600" height="8" fill="#5BC6BD"/><text x="74" y="56" fill="#E6B96D" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">EXHIBIT 03 / THE DECISIONING INVERSION</text><text x="74" y="112" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start">Coordination &amp; Productive Friction</text><text x="74" y="151" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Connecting intelligence can remove duplication—and spread shared mistakes.</text><line x1="72" y1="177" x2="1528" y2="177" stroke="#416078" stroke-width="2"/><text x="105" y="221" fill="#64B3D8" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">LOW INDEPENDENT CHALLENGE</text><text x="1040" y="221" fill="#64B3D8" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">HIGH INDEPENDENT CHALLENGE</text><rect x="95" y="245" width="690" height="202" rx="16" fill="#18283D" stroke="#E59A82" stroke-width="2"/><text x="122" y="291" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">Fragmented work</text><text x="122" y="328" fill="#E59A82" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">Low coordination · weak challenge</text><text x="122" y="372" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Multiple copies of facts</text><text x="122" y="403" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Handoffs and repeated work</text><rect x="815" y="245" width="690" height="202" rx="16" fill="#18283D" stroke="#64B3D8" stroke-width="2"/><text x="842" y="291" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">Independent silos</text><text x="842" y="328" fill="#64B3D8" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">Low coordination · strong challenge</text><text x="842" y="372" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Disagreement can be valuable</text><text x="842" y="403" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">But shared context remains limited</text><rect x="95" y="479" width="690" height="202" rx="16" fill="#18283D" stroke="#E6B96D" stroke-width="2"/><text x="122" y="525" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">Consensus trap</text><text x="122" y="562" fill="#E6B96D" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">High coordination · weak challenge</text><text x="122" y="606" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">One bad input can propagate</text><text x="122" y="637" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Agreement may not be independent</text><rect x="815" y="479" width="690" height="202" rx="16" fill="#18283D" stroke="#5BC6BD" stroke-width="2"/><text x="842" y="525" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">Governed pluralism</text><text x="842" y="562" fill="#5BC6BD" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">High coordination · strong challenge</text><text x="842" y="606" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Common verified evidence</text><text x="842" y="637" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Separate methods and escalation rights</text><rect x="98" y="723" width="1395" height="87" rx="16" fill="#22354A" stroke="#416078" stroke-width="2"/><text x="126" y="757" fill="#5BC6BD" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">REMOVE</text><text x="248" y="757" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">duplicate work</text><text x="608" y="757" fill="#E6B96D" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">PRESERVE</text><text x="774" y="757" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">meaningful challenge</text><text x="1135" y="757" fill="#E59A82" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">REDESIGN</text><text x="1303" y="757" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">new AI risks</text><line x1="72" y1="855" x2="1528" y2="855" stroke="#416078"/><text x="74" y="879" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Christopher Hayes, CDAIO  |  Original conceptual framework, not an empirical measurement</text><text x="1524" y="879" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="end">THE DECISIONING TWIN / PUBLICATION EDITION</text></svg>