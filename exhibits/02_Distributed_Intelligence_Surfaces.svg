<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Distributed Intelligence Surfaces"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64B3D8"/></marker></defs><rect width="1600" height="900" fill="#0E1A2B"/><rect width="1600" height="8" fill="#5BC6BD"/><text x="74" y="56" fill="#E6B96D" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">EXHIBIT 02 / THE DECISIONING INVERSION</text><text x="74" y="112" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start">Distributed Intelligence Surfaces</text><text x="74" y="151" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">AI can assist across an institution without becoming one all-powerful decision-maker.</text><line x1="72" y1="177" x2="1528" y2="177" stroke="#416078" stroke-width="2"/><text x="94" y="234" fill="#E6B96D" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">AI CAPABILITIES ARE DISTINCT FROM AUTHORITY</text><rect x="548" y="344" width="520" height="197" rx="22" fill="#22354A" stroke="#5BC6BD" stroke-width="3"/><text x="808" y="411" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">SHARED VERIFIED CONTEXT</text><text x="808" y="454" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle">Data quality · provenance · permissions</text><text x="808" y="493" fill="#5BC6BD" font-family="Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">Common facts do not require common judgment</text><line x1="808" y1="445" x2="315" y2="338" stroke="#416078" stroke-width="2"  marker-end="url(#a)"/><rect x="95" y="280" width="440" height="116" rx="16" fill="#18283D" stroke="#64B3D8" stroke-width="2"/><text x="117" y="323" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Client / context</text><text x="117" y="357" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Detect changes; confirm facts</text><line x1="808" y1="445" x2="1290" y2="338" stroke="#416078" stroke-width="2"  marker-end="url(#a)"/><rect x="1070" y="280" width="440" height="116" rx="16" fill="#18283D" stroke="#B8A7E5" stroke-width="2"/><text x="1092" y="323" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Advisor / judgment</text><text x="1092" y="357" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Compare, explain, recommend</text><line x1="808" y1="445" x2="315" y2="580" stroke="#416078" stroke-width="2"  marker-end="url(#a)"/><rect x="95" y="522" width="440" height="116" rx="16" fill="#18283D" stroke="#E6B96D" stroke-width="2"/><text x="117" y="565" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Product / alternatives</text><text x="117" y="599" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Evaluate costs and conflicts</text><line x1="808" y1="445" x2="1290" y2="580" stroke="#416078" stroke-width="2"  marker-end="url(#a)"/><rect x="1070" y="522" width="440" height="116" rx="16" fill="#18283D" stroke="#64B3D8" stroke-width="2"/><text x="1092" y="565" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Supervision</text><text x="1092" y="599" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Challenge independently</text><line x1="808" y1="445" x2="580" y2="732" stroke="#416078" stroke-width="2"  marker-end="url(#a)"/><rect x="360" y="674" width="440" height="116" rx="16" fill="#18283D" stroke="#E59A82" stroke-width="2"/><text x="382" y="717" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Operations</text><text x="382" y="751" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Execute only if authorized</text><line x1="808" y1="445" x2="1100" y2="732" stroke="#416078" stroke-width="2"  marker-end="url(#a)"/><rect x="880" y="674" width="440" height="116" rx="16" fill="#18283D" stroke="#5BC6BD" stroke-width="2"/><text x="902" y="717" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Learning / review</text><text x="902" y="751" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Assess outcomes and errors</text><text x="800" y="823" fill="#E6B96D" font-family="Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle">Each surface may analyze or recommend; no surface inherits a different function's mandate.</text><line x1="72" y1="855" x2="1528" y2="855" stroke="#416078"/><text x="74" y="879" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Christopher Hayes, CDAIO  |  Original conceptual framework, not an empirical measurement</text><text x="1524" y="879" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="end">THE DECISIONING TWIN / PUBLICATION EDITION</text></svg>