<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The Authority–Intelligence Boundary"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64B3D8"/></marker></defs><rect width="1600" height="900" fill="#0E1A2B"/><rect width="1600" height="8" fill="#5BC6BD"/><text x="74" y="56" fill="#E6B96D" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">EXHIBIT 04 / THE DECISIONING INVERSION</text><text x="74" y="112" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start">The Authority–Intelligence Boundary</text><text x="74" y="151" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">The ability to reason, recommend or use a tool is not permission to decide or act.</text><line x1="72" y1="177" x2="1528" y2="177" stroke="#416078" stroke-width="2"/><text x="94" y="238" fill="#E6B96D" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">INTELLIGENCE IS INFLUENCE. AUTHORITY IS PERMISSION.</text><rect x="111" y="276" width="1400" height="74" rx="16" fill="#18283D" stroke="#64B3D8" stroke-width="2"/><text x="133" y="309" fill="#64B3D8" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">L0 / OBSERVE</text><text x="431" y="321" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">See an event; never change the system</text><rect x="111" y="367" width="1400" height="74" rx="16" fill="#18283D" stroke="#64B3D8" stroke-width="2"/><text x="133" y="400" fill="#64B3D8" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">L1 / PREPARE</text><text x="431" y="412" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Retrieve information, summarize, draft</text><rect x="111" y="458" width="1400" height="74" rx="16" fill="#18283D" stroke="#B8A7E5" stroke-width="2"/><text x="133" y="491" fill="#B8A7E5" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">L2 / RECOMMEND</text><text x="431" y="503" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Evaluate alternatives; explain trade-offs</text><rect x="1201" y="475" width="275" height="38" rx="19" fill="#304158" stroke="#B8A7E5" stroke-width="1"/><text x="1339" y="501" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Human judgment</text><rect x="111" y="549" width="1400" height="74" rx="16" fill="#22354A" stroke="#E6B96D" stroke-width="2"/><text x="133" y="582" fill="#E6B96D" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">L3 / STAGE</text><text x="431" y="594" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Prepare an action for an authorized decision</text><rect x="1201" y="566" width="275" height="38" rx="19" fill="#304158" stroke="#E6B96D" stroke-width="1"/><text x="1339" y="592" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Approval boundary</text><rect x="111" y="640" width="1400" height="74" rx="16" fill="#22354A" stroke="#E59A82" stroke-width="2"/><text x="133" y="673" fill="#E59A82" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">L4 / EXECUTE</text><text x="431" y="685" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Act only within a tested, enforceable mandate</text><rect x="1201" y="657" width="275" height="38" rx="19" fill="#304158" stroke="#E59A82" stroke-width="1"/><text x="1339" y="683" fill="#ECF3F7" font-family="Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Enforced permissions</text><rect x="111" y="765" width="1400" height="61" rx="16" fill="#22354A" stroke="#E6B96D" stroke-width="2"/><text x="810" y="805" fill="#E6B96D" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle">A credible answer does not confer client consent, professional responsibility, or permission to act.</text><line x1="72" y1="855" x2="1528" y2="855" stroke="#416078"/><text x="74" y="879" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Christopher Hayes, CDAIO  |  Original conceptual framework, not an empirical measurement</text><text x="1524" y="879" fill="#B5C4D5" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="end">THE DECISIONING TWIN / PUBLICATION EDITION</text></svg>